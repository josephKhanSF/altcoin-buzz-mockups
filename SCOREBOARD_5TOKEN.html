<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TNT Score · 5 Altcoins, 5 Catalysts — B-roll Scoreboard</title>
<meta name="theme-color" content="#0d0f12">
<!--
  Altcoin Buzz — 5-token "Top Upcoming" scoreboard (b-roll).
  Serves the scorecard-long "The August Window" cut: 5 dated August catalysts ranked on
  Token Score, with the All-Catalysts final-reveal coda.
  Dark-only. One-screen (no scroll): all 5 rows fit a 16:9 / portrait frame; rows are
  compact full-width horizontal strips. Self-contained (logos + bands inline; offline-safe).
  Data source of truth (as-of 2026-07-30, calibration v2.1): catalyst_inventory.csv (per-catalyst net/tok, X = per-token
  full-board catalyst count) + tnt_scoreboard.csv (all = full-board aggregated Token score / "All Catalysts" = token_score).

  RECORDING CONTROLS (internal team) — everything is BLURRED by default; click to toggle.
    click logo / identity     reveal token logo + name (click again to re-blur)
    click catalyst text       reveal the catalyst (click again to re-blur)
    click a score tile        reveal that score (all three show "?", click again to re-hide)
                              the ALL tile carries the token full-board count: "ALL 20 CATALYSTS"
    R reset · U unblur everything · F fullscreen

  LADDER SORT — two-tier: while a row's ALL CATALYSTS tile is HIDDEN the ladder ranks it on its
    TOKEN score; revealing ALL CATALYSTS is the FINAL reveal that re-ranks that row on the
    full-board aggregate. Un-revealed rows keep seed order below the revealed ones.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ── Brand DNA (DARK ONLY) — carried from altcoin-buzz-mockups ───────── */
:root{
  --bg:#0d0f12; --bg-soft:#141821; --card:#161a22; --card-soft:#1b2029;
  --line:#262b35; --line2:#333a45;
  --ink:#f2f4f7; --txt:#c5ccd6; --mut:#8a93a1; --faint:#5f6775;
  --green:#22e07a; --red:#cc0d1a; --zero:#9aa1ad;
  --gold:#e8b54a; --goldtx:#e8b54a; --goldink:#1a1304;
  --green-soft:rgba(34,224,122,.13); --red-soft:rgba(204,13,26,.14); --zero-soft:rgba(138,144,155,.12);
  --gold-soft:rgba(232,181,74,.12); --gold-line:rgba(232,181,74,.34);
  --logo-wm:#f2f4f7; --logo-gold:#e8b54a; --disc-fill:transparent;
  --lift:#1a212b; --lift-2:#222b37; --lift-line:#333d4b;
  --radius:16px;
  --shadow-lg:0 2px 6px rgba(0,0,0,.45), 0 18px 48px rgba(0,0,0,.5);
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans); color:var(--txt); -webkit-font-smoothing:antialiased; line-height:1.4;
  background:radial-gradient(125% 95% at 50% -8%, #161b24 0%, var(--bg) 55%) fixed;
  height:100dvh; overflow:hidden; display:flex; flex-direction:column; align-items:center;
  padding:clamp(12px,2.4vh,26px) 0 calc(clamp(10px,2vh,20px) + env(safe-area-inset-bottom)); }
.stage{width:92vw; max-width:1180px; flex:1 1 auto; min-height:0; display:flex; flex-direction:column}
:focus-visible{outline:2px solid var(--gold); outline-offset:3px}

/* ── Board: 5 rows, centered, fills the frame, never scrolls ─────────── */
.board{flex:1 1 auto; min-height:0; display:flex; flex-direction:column;
  justify-content:center; gap:clamp(6px,1.1vh,12px)}

.row{flex:0 0 auto; background:linear-gradient(180deg,var(--lift) 0%, #151b24 100%);
  border:1px solid var(--lift-line); border-radius:var(--radius); box-shadow:var(--shadow-lg);
  padding:clamp(7px,1.2vh,13px) clamp(13px,1.6vw,20px); position:relative; overflow:hidden;
  display:flex; align-items:center; gap:clamp(11px,1.5vw,20px)}
/* Row box, rank, and score boxes/labels are visible from the start. Everything else is BLURRED
   by default and toggled by clicking: the identity (logo + name) is one group, the catalyst
   text is another. Click to reveal, click again to re-blur. */
.asset,.cat{transition:filter .55s ease, opacity .55s ease, transform .55s ease; cursor:pointer}
.row:not(.id-shown) .asset{filter:blur(10px); opacity:.9}
.row.id-shown .asset{filter:none; opacity:1; animation:sharpen .5s ease both}
.row:not(.cat-shown) .cat{filter:blur(10px); opacity:.9}
.row.cat-shown .cat{filter:none; opacity:1; animation:sharpen .5s ease both}
@keyframes sharpen{from{transform:translateY(5px)} to{transform:none}}
.row.top{border-color:var(--gold-line)}
.row.top::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px;
  background:linear-gradient(180deg,#eaba50,#d99a2b)}

/* rank */
.rk{flex:0 0 auto; text-align:center; min-width:clamp(38px,3.8vw,56px)}
.rk .n{display:block; font-family:var(--mono); font-weight:700; font-size:clamp(30px,5vh,52px); line-height:1; color:var(--ink); font-variant-numeric:tabular-nums}
.row.top .rk .n{color:var(--gold)}

/* asset */
.asset{flex:0 0 auto; display:flex; align-items:center; gap:clamp(9px,1.1vw,15px); min-width:clamp(126px,13.2vw,196px)}
.tlogo{flex:0 0 auto; display:inline-flex}
.tlogo svg{width:clamp(44px,6.2vh,64px); height:clamp(44px,6.2vh,64px); display:block}
/* XRP's mark ships unfilled and class-themed (.xc disc / .xp glyph) — theme it or it renders black on the dark row. */
.tlogo .xc{fill:#f2f4f7} .tlogo .xp{fill:#141414}
.asset-tx{min-width:0}
.asset-tx b{display:block; font-size:clamp(24px,4vh,38px); font-weight:700; color:var(--ink); letter-spacing:.2px; line-height:1.05}
.asset-tx .full{font-family:var(--mono); font-size:clamp(12px,1.8vh,16px); color:var(--mut); font-weight:500}

/* catalyst (flexes to fill — absorbs the width the retired N/X chip used to hold) */
.cat{flex:1 1 auto; min-width:0; padding:0 clamp(6px,.8vw,14px)}
.cat .name{font-size:clamp(19px,3.1vh,30px); font-weight:700; color:var(--ink); letter-spacing:-.01em; line-height:1.2}

/* score tiles (blurred by default) */
.scores{flex:0 0 auto; display:flex; align-items:center; gap:clamp(8px,1vw,12px)}
.score{position:relative; cursor:pointer; text-align:center; width:clamp(122px,15.2vw,192px);
  background:var(--card-soft); border:1px solid var(--lift-line); border-radius:13px;
  padding:clamp(8px,1.1vh,12px) 8px clamp(10px,1.3vh,14px); font-family:inherit; color:inherit; overflow:hidden;
  transition:border-color .2s, background .2s}
.score:hover{border-color:var(--faint)}
.score .s-lab{display:flex; align-items:center; justify-content:center; text-align:center; min-height:2.2em;
  font-family:var(--mono); font-size:clamp(11px,1.6vh,14.5px); font-weight:700; letter-spacing:1.1px;
  color:var(--ink); text-transform:uppercase; line-height:1.1}
.score .s-lab.s-lab-strong{font-weight:800; color:var(--goldtx)}
.s-fog{display:block; margin-top:3px; filter:blur(12px); transition:filter .45s ease, opacity .35s ease, transform .45s ease; transform:scale(1.04)}
.s-val{display:block; font-family:var(--mono); font-weight:700; font-size:clamp(27px,4.4vh,42px); line-height:1; font-variant-numeric:tabular-nums; color:var(--ink)}
.s-word{display:block; font-family:var(--mono); font-size:clamp(9px,1.25vh,11.5px); font-weight:700; letter-spacing:1.3px; margin-top:5px; color:var(--mut)}
/* "?" placeholder — shown for NETWORK / TOKEN tiles (qmode) while hidden */
.s-q{position:absolute; left:0; right:0; top:0; bottom:0; display:none;
  align-items:center; justify-content:center; pointer-events:none;
  font-family:var(--mono); font-weight:700; font-size:clamp(27px,4.4vh,42px);
  line-height:1; color:var(--mut)}
.score[data-band="bull"] .s-val,.score[data-band="bull"] .s-word{color:var(--green)}
.score[data-band="bear"] .s-val,.score[data-band="bear"] .s-word{color:var(--red)}
.score[data-band="neut"] .s-val,.score[data-band="neut"] .s-word{color:var(--zero)}
.score.shown .s-fog{filter:none; transform:none}
.score.qmode .s-fog{filter:none; transform:none; opacity:0}
.score.qmode.shown .s-fog{opacity:1}
.score.qmode .s-q{display:flex}
.score.qmode.shown .s-q{display:none}
.score.shown[data-band="bull"]{background:var(--green-soft); border-color:color-mix(in srgb,var(--green) 34%,transparent)}
.score.shown[data-band="bear"]{background:var(--red-soft); border-color:color-mix(in srgb,var(--red) 34%,transparent)}
.score.shown[data-band="neut"]{background:var(--zero-soft); border-color:color-mix(in srgb,var(--zero) 30%,transparent)}
/* ALL CATALYSTS: revealing the score rings its box in brand gold (the number keeps its band colour). */
.score.score-all.shown{border-color:var(--gold);
  box-shadow:0 0 0 1px var(--gold), 0 0 20px 2px rgba(232,181,74,.38)}
/* NETWORK & TOKEN sit slightly smaller than the emphasised ALL CATALYSTS tile */
.score:not(.score-all){width:clamp(86px,10.6vw,131px);
  padding:clamp(7px,1vh,10px) 7px clamp(8px,1.1vh,12px)}
.score:not(.score-all) .s-lab{font-size:clamp(9.5px,1.4vh,12.5px)}
.score:not(.score-all) .s-val,
.score:not(.score-all) .s-q{font-size:clamp(24px,3.85vh,37px)}
.score:not(.score-all) .s-word{font-size:clamp(8px,1.1vh,10.5px)}
.score.pop{animation:reveal .42s cubic-bezier(.2,.9,.3,1.4)}
@keyframes reveal{0%{transform:scale(.9)}60%{transform:scale(1.05)}100%{transform:scale(1)}}

/* ── Footer — register CTA (left) + grey icon controls (right) ─────────── */
.ctl{flex:0 0 auto; margin-top:clamp(7px,1.2vh,13px); display:flex; align-items:center;
  justify-content:space-between; gap:10px clamp(14px,2.4vw,32px); flex-wrap:nowrap}
/* Register CTA — footer line, styled to match SCORECARD.html .reg-foot */
.reg-foot{flex:1 1 auto; min-width:0; font-size:clamp(15px,2.4vh,26px); font-weight:600;
  color:var(--ink); text-decoration:none; letter-spacing:.2px; line-height:1.25}
.reg-foot b{color:var(--goldtx); font-weight:700}
.reg-foot .sep{color:var(--faint); font-weight:400; margin:0 .5em}
.reg-foot:hover b{text-decoration:underline}
.ctl-btns{display:flex; align-items:center; gap:clamp(9px,1vw,14px)}
.icon-btn{width:clamp(42px,5.2vh,52px); height:clamp(42px,5.2vh,52px); border-radius:11px;
  border:1px solid var(--lift-line); background:var(--lift); color:var(--mut); cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center;
  transition:color .15s, border-color .15s, background .15s, opacity .2s}
.icon-btn:hover{color:var(--txt); border-color:var(--faint); background:var(--lift-2)}
.icon-btn:active{transform:translateY(1px)}
.icon-btn svg{width:48%; height:48%; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round}
.icon-btn[disabled]{opacity:.3; cursor:default; pointer-events:none}

/* Narrow / portrait fallback: scores drop to a second line so the row never overflows */
@media(max-width:600px){
  .row{flex-wrap:wrap; row-gap:9px}
  .cat{flex:1 1 100%; order:5; padding:0}
  .scores{flex:1 1 100%; order:6}
  .score{flex:1}
  .asset-tx .full{display:none}
}
</style>
</head>
<body>
<div class="stage">

  <div class="board" id="board"></div>

  <div class="ctl">
    <a class="reg-foot" href="https://www.altcoinbuzz.com" target="_blank" rel="noopener"><b>www.altcoinbuzz.com</b><span class="sep">|</span>Register Now for Early Access</a>
    <div class="ctl-btns">
      <button class="icon-btn" id="back" title="Undo last action" aria-label="Undo last action" disabled>
        <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-2"/></svg>
      </button>
      <button class="icon-btn" id="reset" title="Hide all / Show all" aria-label="Hide all or show all">
        <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 2.6-6.4M3 4.5V9h4.5"/></svg>
      </button>
    </div>
  </div>

</div>

  /* "The August Window" 5 — scorecard-long cut, CUT-SELECTION_longform_august-window_2026-07-29.md
     (REVISED 2026-07-30, post-#309 re-audit). Source of truth (as-of 2026-07-30, calibration v2.1):
     catalyst_inventory.csv (per-catalyst net/tok, X = per-token full-board catalyst count) +
     tnt_scoreboard.csv (all = full-board aggregated Token score / "All Catalysts" = token_score).
     ⚠ Order top→bottom = SEED = REVEAL order, deliberately NOT final rank — un-revealed rows sit in
     seed order, so a rank-ordered seed would leak the winner before the reveals. The ladder sorts
     itself live as tiles are revealed.
     Final catalyst rank (Token): HYPE 8.0 > AERO 6.2 > XRP 5.9 > VVV 5.4 > PYTH 4.5.
     All-Catalysts coda rank (aggregate): VVV 5.2 > AERO 4.8 > HYPE 4.8 > XRP 4.7 > PYTH 4.6
     (AERO/HYPE tie at 4.8 broken to AERO on aggregate Network 5.6 vs 5.3). */
  /* NOTE: `total` = the per-token full-board catalyst_count (tnt_scoreboard.csv catalyst_count).
     The gold "N/X CATALYSTS" chip column was retired 2026-07-30; the count now renders as the
     ALL CATALYSTS tile label ("ALL 20 CATALYSTS"), so `total` is still load-bearing. */
  var TOKENS = [
    { rank:1, ticker:"XRP",  name:"XRP (XRP Ledger)", total:20, cat:"CLARITY Act",                net:5.0, tok:5.9, all:4.7 },
    { rank:2, ticker:"PYTH", name:"Pyth Network",     total:20, cat:"Pyth Core goes paid",        net:8.0, tok:4.5, all:4.6 },
    { rank:3, ticker:"AERO", name:"Aerodrome",        total:16, cat:"$400k public audit contest", net:6.8, tok:6.2, all:4.8 },
    { rank:4, ticker:"VVV",  name:"Venice",           total:10, cat:"DIEM staking cap raise",     net:5.0, tok:5.4, all:5.2 },
    { rank:5, ticker:"HYPE", name:"Hyperliquid",      total:13, cat:"Coinbase USDC treasury",     net:5.0, tok:8.0, all:4.8 }
  ];

  function band(n){ return n>=5.6 ? "bull" : (n>=4.5 ? "neut" : "bear"); }
  function word(n){ return n>=5.6 ? "BULLISH" : (n>=4.5 ? "NEUTRAL" : "BEARISH"); }
  function one(n){ return Number(n).toFixed(1); }

  /* kind = the stable TYPE KEY ("NETWORK" / "TOKEN" / "ALL CATALYSTS") — it drives every class
     and must never change. label = what the viewer reads; defaults to kind. The ALL CATALYSTS
     tile passes a per-token label ("ALL 20 CATALYSTS"), which is where the retired N/X chip
     count now lives. */
  function scoreTile(kind, val, qmode, label){
    var b = band(val);
    var txt = label || kind;
    var labCls = "s-lab" + (kind === "ALL CATALYSTS" ? " s-lab-strong" : "");
    var tileCls = "score" + (qmode?" qmode":"")
      + (kind === "ALL CATALYSTS" ? " score-all" : "")
      + (kind === "TOKEN" ? " score-tok" : "");
    return '<button class="'+tileCls+'" data-band="'+b+'" type="button" aria-pressed="false" aria-label="'+txt+' score, click to toggle">'
      + '<span class="'+labCls+'">'+txt+'</span>'
      + '<span class="s-fog"><span class="s-val">'+one(val)+'</span><span class="s-word">'+word(val)+'</span></span>'
      + '<span class="s-q">?</span>'
      + '</button>';
  }

  function rowHTML(t){
    return '<div class="rk"><span class="n">'+t.rank+'</span></div>'
      + '<div class="asset"><span class="tlogo">'+(LOGOS[t.ticker]||"")+'</span>'
      +   '<div class="asset-tx"><b>'+t.ticker+'</b><span class="full">'+t.name+'</span></div></div>'
      + '<div class="cat"><div class="name">'+t.cat+'</div></div>'
      + '<div class="scores">'+scoreTile("NETWORK", t.net, true)+scoreTile("TOKEN", t.tok, true)+scoreTile("ALL CATALYSTS", t.all, true, "ALL "+t.total+" CATALYSTS")+'</div>';
  }

  /* Build all 5 rows up front — all blurred by default; each group is click-toggled. */
  var board = document.getElementById("board");
  var rowEls = TOKENS.map(function(t){
    var el = document.createElement("div");
    el.className = "row" + (t.rank===1 ? " top" : "");
    el.dataset.all  = t.all;   // ALL CATALYSTS aggregate — sort key AFTER its final reveal
    el.dataset.tok  = t.tok;   // TOKEN score — sort key WHILE All-Catalysts stays hidden
    el.dataset.seed = t.rank;  // original board order — used for ties / hidden rows
    el.innerHTML = rowHTML(t);
    board.appendChild(el);
    return el;
  });

  /* ── Live re-rank: revealing a score slides rows into order (highest→lowest on top;
     un-revealed rows keep seed order below). Fixed 1–5 ladder — the row content moves
     between the rungs, position 1 always shows the current leader.
     Two-tier key: while a row's ALL CATALYSTS tile is hidden the ladder sorts on its TOKEN
     score; the ALL CATALYSTS reveal is the FINAL reveal that re-sorts the row on the aggregate. */
  function scoreShown(el,sel){ var s=el.querySelector(sel); return !!s && s.classList.contains("shown"); }
  function allShown(el){ return scoreShown(el,".score-all"); }
  function tokShown(el){ return scoreShown(el,".score-tok"); }
  function sortInfo(el){
    if(allShown(el)) return { tier:2, val:parseFloat(el.dataset.all) };   // final: All-Catalysts aggregate
    if(tokShown(el)) return { tier:1, val:parseFloat(el.dataset.tok) };   // interim: Token column
    return { tier:0, val:0 };                                            // neither shown → parked below
  }
  function rankCompare(a,b){
    var ia=sortInfo(a), ib=sortInfo(b);
    if(ia.tier!==ib.tier) return ib.tier-ia.tier;          // higher tier floats up (All > Token > hidden)
    if(ia.tier>0){ var d=ib.val-ia.val; if(d) return d; }  // higher score first
    return (+a.dataset.seed)-(+b.dataset.seed);             // tie / both hidden → seed order
  }
  function sortBoard(){
    var firsts = rowEls.map(function(el){ return el.getBoundingClientRect().top; });  // FLIP: First
    var order  = rowEls.slice().sort(rankCompare);
    order.forEach(function(el){ board.appendChild(el); });                            // reorder DOM (Last)
    order.forEach(function(el,i){                                                     // renumber the ladder
      el.querySelector(".rk .n").textContent = (i+1);
      el.classList.toggle("top", i===0);
    });
    rowEls.forEach(function(el,idx){                                                  // Invert + Play
      var dy = firsts[idx] - el.getBoundingClientRect().top;
      if(Math.abs(dy) < 0.5) return;
      el.style.transition = "none";
      el.style.transform  = "translateY(" + dy + "px)";
      requestAnimationFrame(function(){
        el.style.transition = "transform .85s cubic-bezier(.33,1.35,.62,1)";
        el.style.transform  = "";
      });
    });
  }

  function reset(){
    rowEls.forEach(function(el){
      el.classList.remove("id-shown","cat-shown");
      el.querySelectorAll(".score").forEach(function(s){
        s.classList.remove("shown","pop"); s.setAttribute("aria-pressed","false");
      });
    });
    sortBoard();                                      // slide everything back to seed order
  }

  function unblurAll(){                                // power shortcut (U) — reveal everything
    rowEls.forEach(function(el){
      el.classList.add("id-shown","cat-shown");
      el.querySelectorAll(".score:not(.shown)").forEach(function(s){
        s.classList.add("shown","pop"); s.setAttribute("aria-pressed","true");
      });
    });
    sortBoard();                                      // settle into the full leaderboard
  }

  /* ── Undo history + Hide-all / Show-all toggle ────────────────────────── */
  var history = [];
  var backBtn = document.getElementById("back");

  function snapshot(){                                 // capture the full reveal state of every row
    return rowEls.map(function(el){
      return { id:el.classList.contains("id-shown"), cat:el.classList.contains("cat-shown"),
        sc:[].map.call(el.querySelectorAll(".score"), function(s){ return s.classList.contains("shown"); }) };
    });
  }
  function pushHistory(){
    history.push(snapshot());
    if(history.length > 200) history.shift();
    if(backBtn) backBtn.disabled = false;
  }
  function applySnapshot(snap){                        // restore a captured state, then re-rank/animate
    rowEls.forEach(function(el,i){
      var st = snap[i];
      el.classList.toggle("id-shown", st.id);
      el.classList.toggle("cat-shown", st.cat);
      [].forEach.call(el.querySelectorAll(".score"), function(s,j){
        var on = st.sc[j];
        s.classList.toggle("shown", on); s.classList.remove("pop");
        s.setAttribute("aria-pressed", on ? "true" : "false");
      });
    });
    sortBoard();
  }
  function back(){                                     // undo the previous action
    if(!history.length) return;
    applySnapshot(history.pop());
    if(backBtn) backBtn.disabled = history.length === 0;
  }

  function anyShown(){
    return rowEls.some(function(el){
      return el.classList.contains("id-shown") || el.classList.contains("cat-shown")
        || el.querySelector(".score.shown");
    });
  }
  /* Reset button: hide everything if anything is showing, otherwise reveal everything. */
  function toggleReset(){ pushHistory(); if(anyShown()) reset(); else unblurAll(); }

  /* Click to toggle. Three independent groups per row:
     score tile (each its own "?" toggle) · identity (logo + name) · catalyst text. */
  board.addEventListener("click", function(e){
    var s = e.target.closest(".score");
    var asset = s ? null : e.target.closest(".asset");
    var catEl = (s || asset) ? null : e.target.closest(".cat");
    if(!s && !asset && !catEl) return;
    pushHistory();
    if(s){
      var on = s.classList.toggle("shown");
      s.setAttribute("aria-pressed", on ? "true" : "false");
      s.classList.remove("pop");
      if(on){ void s.offsetWidth; s.classList.add("pop"); }
      if(s.classList.contains("score-all") || s.classList.contains("score-tok")) sortBoard();   // re-rank on TOKEN (interim) or ALL CATALYSTS (final) reveal/hide
      return;
    }
    if(asset){ asset.closest(".row").classList.toggle("id-shown"); return; }
    if(catEl){ catEl.closest(".row").classList.toggle("cat-shown"); }
  });

  function toggleFull(){
    if(document.fullscreenElement){ document.exitFullscreen(); }
    else if(document.documentElement.requestFullscreen){ document.documentElement.requestFullscreen(); }
  }
  document.getElementById("reset").addEventListener("click", toggleReset);
  backBtn.addEventListener("click", back);

  document.addEventListener("keydown", function(e){
    var k = e.key;
    if(k==="r" || k==="R"){ toggleReset(); }
    else if(k==="u" || k==="U"){ pushHistory(); unblurAll(); }
    else if(k==="z" || k==="Z"){ back(); }
    else if(k==="f" || k==="F"){ toggleFull(); }
  });
})();
</script>
</body>
</html>
