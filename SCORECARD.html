<!--
  SCORECARD.html (canonical name since 2026-07-02; formerly SCOREBOARD_BOARD_16x9.html) — REVISION 2 (video-team mobile-readability + operator feedback r1-r4; committed 2026-06-23).
  vs the live REVISION 1:
   1. Catalyst labels shortened to 2–4 words (full text kept for the detail overlay) + typography enlarged.
   2. Legend removed; icon-only operator cluster (Blur all · Reveal all · Verdict/TNT) in the top-right slot.
      (The Dark/Light toggle was removed in REVISION 5 — board is dark-only.)
   3. Bottom "Reveal control" panel removed entirely (no 1–14 buttons, Reveal-next, Undo, Hide-panel, hint line).
   4. "Blur all" blurs ONLY the score capsules — catalyst names stay sharp.
   5. Per-catalyst detail overlay: "Catalyst #N", centered short title + full-name subtext, Network/Token as NUMBERS (no dials);
      pinned to the TOP HALF of the stage to keep the bottom-right clear for a VO-talent overlay.
   6. Right-rail averages: labels enlarged + gold, shown as NUMBERS (no dials).
   7. Verdict popup rebuilt to the finalised design direction (Website/netlify_root/index.html):
      TNT dial + read on TOP, the three numeric scores (Token/Network/Technicals) BELOW; the TNT dial is the ONLY dial.
      Closeable (X button · click-outside · Esc · Verdict icon · Blur-all).
   8. Per-row TWO-STAGE reveal (operator feedback r3): click a row once → Network score + Network average;
      click the same row again → Token score + Token average; a third click resets that row. Blur-all clears all.
      Network average counts rows at stage ≥1; Token average counts rows at stage ≥2 — the two panels move independently.
   9. Verdict popup runs the OPPOSITE theme of the board (dark board → light card, light board → dark card) so it stays
      distinct from the stage (operator feedback r4). Backdrop dim stays board-themed; XRP logo flips for contrast.
  Data, scores and band thresholds are UNCHANGED (WORKSHOP_BRIEF §1, locked). Dials reserved for the TNT Score only.

  REVISION 3 (operator feedback, 2026-07-02):
   A. Row highlight: clicking a row now paints the whole row with a GOLD border (the exclusive
      "highlight"). Reveal cycle per row is unchanged (Network → Token → hidden); the third click
      also drops the gold. Reveal state stays PER-ROW (several rows can be revealed at once), but
      only ONE row is highlighted at a time.
   B. Right-rail boxes no longer average the revealed rows. They MIRROR the highlighted row's
      revealed scores (Network at stage ≥1, Token at stage ≥2) and wear the same gold border.
      With NO row highlighted they show the board TOTALS only when every row is fully revealed
      (i.e. after Reveal-all) — otherwise blank. Totals = tnt_scoreboard.csv roll-up (Network 6.0
      BULLISH · Token 4.9 NEUTRAL), sourced not recomputed. "N of 14 revealed" caption removed.
   C. Verdict/TNT popup refreshed to the reconciled scoreboard: TNT 4.2 BEARISH (was 4.7),
      Technicals 3.4 BEARISH (was 4.4; latest TA "XRP TA — 26_06_2026.md"); Token 4.9 / Network 6.0
      unchanged.

  REVISION 4 (operator feedback, 2026-07-02):
   A. Row click is now a FOUR-click cycle (was three): 1 highlight+Network · 2 highlight+Token ·
      3 remove highlight but KEEP both scores shown · 4 blur both. `stage` is now the reveal
      level only (0/1/2); highlight is an independent exclusive overlay.
   B. Verdict popup CTA: the domain is now a gold capsule (gold bg / near-black text) and the
      "—" separator before "Register Now for Early Access" is removed.

  REVISION 5 (operator feedback, 2026-07-02):
   A. Big-box captions: each right-rail box now carries a caption above its Network/Token label —
      the highlighted catalyst's title when the box mirrors a revealed row score, "TOTAL SCORE"
      when it shows the board total, nothing when blank. Caption text is white.
   B. LIGHT THEME REMOVED (never used on camera). Board palette collapsed into :root (dark);
      Dark/Light toggle button, toggleTheme(), the `D` shortcut, the SUN/MOON icons and the
      light-logo variant are all gone. The verdict popup keeps its light card (now an
      unconditional #tntClose rule rather than a board-theme inversion).

  REVISION 6 (2026-07-02) — RE-POINTED XRP → AAVE.
   Board now renders the AAVE lead (20260625-aave_scorecard-11c5786c). All data is the
   daily-synced single source: catalyst_inventory.csv (11 AAVE rows → the DATA array) and
   tnt_scoreboard.csv (totals Network 5.8 / Token 5.8; TNT 6.2; Technicals 6.5 as-of 2026-06-26;
   all BULLISH). Verdict popup copy (headline / paragraph / per-pillar reads) synthesised from the
   RESEARCH Verdict section — the refresh's story is that the network↔token decoupling has CLOSED
   (5.8 ≈ 5.8). Asset mark swapped to the AAVE ghost. Interaction/highlight/caption logic unchanged.
   NOTE: XRP-specific numbers cited in REVISION 3–4 above describe the prior XRP build, not this one.

  REVISION 7 (operator request, 2026-08-05) — PER-COLUMN REVEAL. Mechanic change; README_SCORECARD.md
  updated in the same session per the co-ownership rule (PLAN.md ADDENDUM 12, rule 1).
   A. STATE MODEL SPLIT. The per-row ordered scalar `dataset.stage` (0 both blurred · 1 Network ·
      2 both) is replaced by TWO INDEPENDENT FLAGS, `dataset.net` and `dataset.tok` ("0"|"1").
      The scalar hard-coded Network-before-Token and could not represent "Token shown, Network
      hidden" — the state a Token-column reveal produces. The CSS was already column-independent
      (.net-hidden / .tok-hidden are separate classes), so only the state layer moved.
      `applyStage()` → `applyReveal()`.
   B. FOUR-CLICK ROW CYCLE IS UNCHANGED, re-expressed on the pair: 1 gold+Network · 2 gold+Token ·
      3 drop gold, keep both · 4 blur both. Clicking a different row still moves the gold and
      leaves the previous row revealed. ONE new arm the old scalar could not reach: a Token-only
      row (produced by the Token column button) reveals Network and takes the gold — the analogue
      of the 1st click.
   C. TWO NEW OPERATOR BUTTONS — "Reveal / hide ALL Network scores" and "…ALL Token scores"
      (toggleColumn('net'|'tok')). STATELESS: each reads the board rather than latching, so it
      stays correct after any amount of individual row clicking — whole column revealed → the
      click hides it, otherwise it reveals it. Each CLEARS the gold highlight (same as Reveal all).
      Both wear the `.on` state while their column is fully revealed (syncColumnButtons()).
      Cluster is now 5 icons: Blur all · Reveal all · Network col · Token col · Verdict/TNT.
   D. RIGHT-RAIL TOTALS ARE NOW DECIDED PER COLUMN. Was: both boxes show the board totals only
      when EVERY row is fully revealed. Now: the Network box shows NET_TOTAL when every row's
      Network is revealed, the Token box shows TOK_TOTAL when every row's Token is revealed —
      independently. A highlighted row still wins over totals (unchanged). Reveal-all still lands
      both totals exactly as before.
   E. Keyboard: `N` = Network column, `K` = Token column (`T` remains the verdict popup).
   Data, GEN:BOARD and the detail overlay are UNTOUCHED. The detail overlay keeps its own ordered
   `#detail[data-stage]` scalar — a different surface, deliberately out of scope.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{  /* dark board only — the light theme was removed (never used on camera) */
    --bg:#0b0c0e; --card:#15171b; --card2:#1c1f24; --line:#23262c; --line2:#2f333b;
    --ink:#f3f1ec; --txt:#cfccc5; --mut:#9a958c; --faint:#6b6760;
    --green:#46c986; --red:#e06565; --zero:#8b9099; --yellow:#e8b53f;
    --gold:#e8b54a; --goldtx:#e8b54a; --goldink:#161006;
    --sans:'Archivo',system-ui,Arial,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,monospace;
    --r-card:16px; --r-chip:999px;
    --glow:#181b20;
    --shadow:0 2px 6px rgba(0,0,0,.45), 0 10px 30px rgba(0,0,0,.5);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#0a0a0b;overflow:hidden}
  body{font-family:var(--sans);color:var(--ink)}

  /* ===== 1920×1080 stage, scale-to-fit ===== */
  #stageWrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{width:1920px;height:1080px;flex:none;position:relative;overflow:hidden;
    background:radial-gradient(1700px 900px at 78% -20%, var(--glow) 0%, transparent 60%), var(--bg);
    display:flex;flex-direction:column;padding:46px 56px 40px}

  /* ===== Title row ===== */
  .topbar{display:flex;align-items:center;gap:22px;flex:none;margin-bottom:26px}
  .logo{width:64px;height:64px;flex:none;display:block}
  .titles{display:flex;flex-direction:row;align-items:center;gap:22px}
  .titles h1{font-size:42px;font-weight:700;letter-spacing:-.6px;line-height:1;color:#fff;white-space:nowrap}
  .titles h1 .x{color:#fff}
  .titles h1 .tnt{color:var(--goldtx)}
  .titles .vpill{font-size:28px;font-weight:700;line-height:1;color:var(--goldink);background:var(--gold);padding:9px 22px;border-radius:999px;letter-spacing:.2px;white-space:nowrap}

  /* ===== Operator control cluster (icon-only; replaces the legend) — deliberately faint on camera ===== */
  .controls{margin-left:auto;display:flex;gap:10px;align-items:center}
  .ctrl{width:46px;height:46px;flex:none;border-radius:12px;border:1px solid var(--line2);background:var(--card);
    color:var(--mut);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;opacity:.4;
    transition:opacity .15s ease,color .15s ease,background .15s ease,border-color .15s ease}
  .ctrl:hover{opacity:1;color:var(--goldtx);background:color-mix(in srgb,var(--gold) 14%,var(--card))}
  .ctrl.on{opacity:1;color:var(--green);border-color:var(--green)}
  .ctrl svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  /* ===== Two-column body: table (left) + average panels (right) ===== */
  .body{flex:1;min-height:0;display:flex;gap:34px}
  .tablecard{flex:1;min-width:0;background:var(--card);border:1px solid var(--line2);border-radius:var(--r-card);
    box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
  .thead{display:flex;align-items:center;height:52px;flex:none;padding:0 26px;
    border-bottom:1px solid var(--line);color:var(--txt);font-size:19px;font-weight:700;letter-spacing:.1px}
  .rows{flex:1;display:flex;flex-direction:column;padding:0 26px}
  .tr{display:flex;align-items:center;flex:1;min-height:0;border-bottom:1px solid var(--line);position:relative;cursor:pointer}
  .tr:last-child{border-bottom:none}
  /* Single exclusive GOLD highlight — marks the row the big score boxes are mirroring.
     box-shadow (not border) so the row height/layout never shifts. */
  .tr.hl{box-shadow:inset 0 0 0 3px var(--gold);border-radius:12px;
    background:color-mix(in srgb,var(--gold) 8%,transparent)}
  @keyframes landed{0%{background:color-mix(in srgb, var(--gold) 24%, transparent)}100%{background:transparent}}

  .c-num{width:42px;flex:none;font-size:22px;font-weight:700;color:var(--mut)}
  .c-cat{flex:1;min-width:0;padding-right:18px;display:flex;align-items:center;gap:16px}
  .c-cat .lab{font-size:32px;font-weight:700;line-height:1.05;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .expand{flex:none;width:42px;height:42px;border-radius:10px;border:1px solid var(--line2);background:var(--card);
    color:var(--mut);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;opacity:.6;
    transition:opacity .15s ease,color .15s ease,background .15s ease}
  .expand:hover{opacity:1;color:var(--goldtx);background:color-mix(in srgb,var(--gold) 14%,var(--card))}
  .expand svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  .c-net,.c-tok{width:176px;flex:none;display:flex;align-items:center;justify-content:center}
  /* Blur veil applies to the SCORE capsules ONLY — catalyst names stay sharp.
     Two-stage reveal: a row hides Network and/or Token independently. */
  .scorecell{transition:filter .8s ease, opacity .8s ease}
  .scorecell.just{animation:landed 1.05s ease-out;border-radius:10px}
  .tr.net-hidden .c-net{filter:blur(11px) saturate(.7);opacity:.42}
  .tr.tok-hidden .c-tok{filter:blur(11px) saturate(.7);opacity:.42}

  /* per-catalyst capsule: band word + score, band-coloured outline (NOT a dial) */
  .cap{display:inline-flex;align-items:center;gap:10px;height:46px;padding:0 18px;border-radius:var(--r-chip);
    border:2px solid var(--line2);background:var(--card)}
  .cap .w{font-family:var(--sans);font-weight:700;font-size:13px;letter-spacing:.8px}
  .cap .v{font-family:var(--mono);font-weight:700;font-size:26px;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
  .cap.bull{border-color:color-mix(in srgb,var(--green) 55%,var(--card));background:color-mix(in srgb,var(--green) 7%,var(--card))}
  .cap.bull .w,.cap.bull .v{color:var(--green)}
  .cap.bear{border-color:color-mix(in srgb,var(--red) 55%,var(--card));background:color-mix(in srgb,var(--red) 7%,var(--card))}
  .cap.bear .w,.cap.bear .v{color:var(--red)}
  .cap.neu{border-color:color-mix(in srgb,var(--zero) 50%,var(--card));background:color-mix(in srgb,var(--zero) 7%,var(--card))}
  .cap.neu .w,.cap.neu .v{color:var(--zero)}

  /* ===== Right rail: running AVERAGES as numbers (no dials) ===== */
  .rail{width:620px;flex:none;display:flex;flex-direction:column;gap:30px}
  .avgcard{flex:1;background:var(--card);border:1px solid var(--line2);border-radius:var(--r-card);box-shadow:var(--shadow);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:24px;
    transition:border-color .2s ease,box-shadow .2s ease}
  /* Big box wears the same GOLD when a row is highlighted (mirrors the row border) */
  .avgcard.hl{border-color:var(--gold);box-shadow:inset 0 0 0 3px var(--gold),var(--shadow)}
  /* Caption above the Network/Token label — highlighted catalyst title, or "TOTAL SCORE" (reserved height so the big number never shifts) */
  .avcap{font-size:27px;font-weight:600;color:#ffffff;line-height:1.15;min-height:34px;
    max-width:560px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.2px}
  .avname{font-size:48px;font-weight:700;color:var(--goldtx);letter-spacing:-.5px;line-height:1}
  .avnum{font-family:var(--mono);font-weight:700;font-size:108px;line-height:1;font-variant-numeric:tabular-nums;color:var(--zero)}
  .avword{font-family:var(--mono);font-size:30px;font-weight:700;letter-spacing:1.5px}
  .avnum.bull,.avword.bull{color:var(--green)} .avnum.bear,.avword.bear{color:var(--red)} .avnum.neu,.avword.neu{color:var(--zero)}
  .count{font-size:18px;font-weight:500;color:var(--mut);margin-top:6px}
  .foot{flex:none;display:flex;align-items:center;justify-content:center;padding-top:14px}

  /* ===== Per-catalyst DETAIL overlay (expand) — scores only, no dials.
     Pinned to the TOP HALF of the stage so the bottom-right stays clear for a VO-talent overlay. ===== */
  #detail{position:absolute;inset:0;z-index:60;display:flex;align-items:flex-start;justify-content:center;padding-top:32px;
    background:color-mix(in srgb, var(--bg) 58%, transparent);backdrop-filter:blur(10px);
    opacity:0;pointer-events:none;transition:opacity .3s ease}
  #detail.show{opacity:1;pointer-events:auto}
  .detailcard{position:relative;background:var(--card);border:1px solid var(--line2);border-radius:26px;
    box-shadow:0 30px 90px rgba(0,0,0,.42);padding:52px 72px 60px;width:1480px;max-width:95%;text-align:center}
  .dclose{position:absolute;top:24px;right:24px;width:54px;height:54px;border-radius:50%;border:1px solid var(--line2);
    background:var(--card2);color:var(--mut);display:flex;align-items:center;justify-content:center;cursor:pointer}
  .dclose:hover{color:var(--ink)}
  .dclose svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
  .dnum{font-family:var(--mono);font-size:30px;font-weight:700;letter-spacing:1px;color:var(--goldtx);margin-bottom:14px}
  .dtitle{font-size:74px;font-weight:700;letter-spacing:-1.3px;line-height:1.02;color:var(--ink)}
  .dfull{font-size:30px;font-weight:500;color:var(--mut);margin-top:16px;line-height:1.35}
  .dgauges{display:flex;gap:90px;justify-content:center;margin-top:48px}
  .dg{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
  .dgname{font-size:34px;font-weight:700;color:var(--ink);margin-bottom:4px}
  .dscore{font-family:var(--mono);font-weight:700;font-size:118px;line-height:1;font-variant-numeric:tabular-nums;color:var(--zero)}
  .dword{font-size:34px;font-weight:700;letter-spacing:.5px;color:var(--zero)}
  .dscore.bull,.dword.bull{color:var(--green)} .dscore.bear,.dword.bear{color:var(--red)} .dscore.neu,.dword.neu{color:var(--zero)}

  /* Staged reveal INSIDE the detail overlay — mirrors the row two-stage blur.
     stage 0 = both gauges blurred · 1 = Network shown · 2 = both shown. */
  .dg{transition:filter .55s ease, opacity .55s ease}
  #detail[data-stage="0"] .dg-net,
  #detail[data-stage="0"] .dg-tok,
  #detail[data-stage="1"] .dg-tok{filter:blur(22px) saturate(.7);opacity:.4}
  #detail[data-stage="0"] .dg-net,
  #detail[data-stage="0"] .dg-tok,
  #detail[data-stage="1"] .dg-tok{cursor:pointer}

  /* Register CTA — footer line (main board) + inline divider line (verdict popup) */
  .reg-foot,.reg-inline{font-size:26px;font-weight:600;color:var(--mut);text-decoration:none;letter-spacing:.2px}
  .reg-foot{font-size:34px;color:var(--ink)}
  .reg-foot .sep{color:var(--faint);font-weight:400;margin:0 .5em}
  .reg-foot b,.reg-inline b{color:var(--goldtx);font-weight:700}
  .reg-foot:hover b,.reg-inline:hover b{text-decoration:underline}
  /* Verdict popup: domain rendered as a GOLD capsule with near-black text */
  .reg-cap{display:inline-block;vertical-align:middle;background:var(--gold);color:var(--goldink);
    font-weight:700;padding:3px 16px;border-radius:999px;letter-spacing:.2px}
  .reg-inline:hover .reg-cap{filter:brightness(.95)}
  .vc-div{font-size:30px;font-weight:300;color:var(--line2)}

  /* ===== T·N·T verdict close (T) — finalised design direction (netlify_root/index.html) ===== */
  #tntClose{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
    background:color-mix(in srgb, var(--bg) 70%, transparent);backdrop-filter:blur(8px);
    opacity:0;pointer-events:none;transition:opacity .5s ease}
  #tntClose.show{opacity:1;pointer-events:auto}
  .closecard{position:relative;background:var(--card);border:1px solid var(--line2);border-radius:24px;
    box-shadow:0 24px 70px rgba(0,0,0,.4);padding:40px 64px 48px;width:1500px;max-width:95%}
  .closecard .bull{color:var(--green)} .closecard .bear{color:var(--red)} .closecard .neu{color:var(--zero)}
  /* The verdict popup runs LIGHT against the dark board so it stays distinct from the stage behind it.
     (--bg is left board-themed so the dimmed backdrop still matches the stage.) */
  #tntClose{
    --card:#ffffff; --card2:#f4f1ea; --line:#ece7dc; --line2:#ddd5c6;
    --ink:#15140f; --txt:#2b2925; --mut:#5f5b52; --faint:#98917f;
    --green:#15824a; --red:#bf3d3d; --zero:#5f6470; --yellow:#d99e0b;
    --vc-disc:#0e1014; --vc-mark:#f2f4f7;
  }

  /* Technicals: the "Technicals" label stays sharp; the score swaps to a dash until revealed by click */
  #tntClose.tech-hidden .vc-tech{cursor:pointer}
  #tntClose.tech-hidden .vc-techval{display:none}
  .vc-techdash{display:none;font-family:var(--mono);font-weight:700;font-size:60px;line-height:1.1;color:var(--zero)}
  #tntClose.tech-hidden .vc-techdash{display:block}

  .vc-top{display:flex;align-items:center;justify-content:flex-start;gap:18px;margin-bottom:20px;padding-right:60px}
  .vc-asset{display:flex;align-items:center;gap:14px}
  .vc-logo{width:46px;height:46px;display:block}
  .vc-logo .xc{fill:var(--vc-disc)} .vc-logo .xp{fill:var(--vc-mark)}
  .vc-asset b{font-size:34px;font-weight:700;color:var(--ink)}
  .vc-asset .tick{font-family:var(--mono);font-size:22px;color:var(--mut)}
  .vc-asof{display:inline-flex;align-items:center;gap:9px;font-family:var(--mono);font-size:22px;font-weight:500;color:var(--faint)}
  .vc-asof svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  /* TNT block ON TOP — the ONLY dial; sits on a raised grey panel so it pops */
  .vc-tnt{display:flex;align-items:center;gap:54px;background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:32px 44px}
  .vc-dial{flex:0 0 440px;display:flex;flex-direction:column;align-items:center}
  .vc-lab{font-family:var(--mono);font-size:34px;font-weight:700;letter-spacing:3px;color:var(--txt);margin-bottom:8px}
  .vc-dial .tnt-dial{display:block;width:340px;margin:0 auto -8px}
  .vc-num{font-family:var(--mono);font-weight:700;font-size:104px;line-height:1;font-variant-numeric:tabular-nums}
  .vc-word{font-family:var(--mono);font-size:30px;font-weight:700;letter-spacing:2px;margin-top:4px}
  .vc-txt{flex:1;min-width:0}
  .vc-txt h4{font-size:54px;font-weight:700;letter-spacing:-1px;line-height:1.06;color:var(--ink)}
  .vc-txt p{font-size:28px;color:var(--mut);line-height:1.4;margin-top:18px}

  /* three numeric scores BELOW */
  .vc-strip{display:flex;gap:14px;margin-top:26px}
  .vc-cell{flex:1;min-width:0;text-align:center}
  .vc-pillar{font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:2px;color:var(--txt);text-transform:uppercase}
  .vc-n{font-family:var(--mono);font-weight:700;font-size:60px;line-height:1.1;font-variant-numeric:tabular-nums}

function tntDialSVG(score){
  const cx=100, cy=96, r=78;
  const ang=(180-(score-1)/9*180)*Math.PI/180;
  const bx=(cx+r*Math.cos(ang)).toFixed(2), by=(cy-r*Math.sin(ang)).toFixed(2);
  return `<svg class="tnt-dial" viewBox="0 0 200 110" aria-hidden="true">
    <path d="M22 96 A78 78 0 0 1 178 96" fill="none" stroke="var(--line)" stroke-width="14" stroke-linecap="round"/>

    <circle cx="${bx}" cy="${by}" r="7" fill="var(--ink)"/>

}

     the band word is blanked so the box reads "?" alone, not "? / —". */
  if(val==null){ capEl.textContent=""; numEl.textContent="?"; numEl.className="avnum neu"; wEl.textContent=""; wEl.className="avword neu"; }
  else { capEl.textContent=caption||""; numEl.textContent=fmt1(val); numEl.className="avnum "+bandKey(val); wEl.textContent=bandWord(val); wEl.className="avword "+bandKey(val); }
}
function setHighlight(idx){
  hlIndex=idx;
  trs.forEach((tr,k)=>tr.classList.toggle("hl", k===idx));   // exclusive: one gold row
}

/* ===== Per-row reveal state (REVISION 7) =====
   TWO INDEPENDENT FLAGS, not an ordered stage: dataset.net and dataset.tok, each "0" | "1".
   The old scalar `stage` (0/1/2) could not represent "Token shown, Network hidden" — a state the
   per-column reveal buttons produce — so it was split. The four-click row cycle is unchanged;
   it is simply expressed on the pair (see toggleRow).
   Reveal state is INDEPENDENT per row — multiple rows can stay revealed at once. */
function applyReveal(tr){
  tr.classList.toggle("net-hidden", tr.dataset.net!=="1");
  tr.classList.toggle("tok-hidden", tr.dataset.tok!=="1");
}
function flashCell(tr,sel){ const c=tr.querySelector(sel); if(!c)return; c.classList.remove("just"); void c.offsetWidth; c.classList.add("just"); }

function recompute(){
  const netCap=document.getElementById("netCap"), netN=document.getElementById("netNum"), netW=document.getElementById("netWord");
  const tokCap=document.getElementById("tokCap"), tokN=document.getElementById("tokNum"), tokW=document.getElementById("tokWord");
  const netCard=document.getElementById("netCard"), tokCard=document.getElementById("tokCard");
  if(hlIndex!=null){
    const tr=trs[hlIndex], d=DATA[+tr.dataset.i];
    setBig(netCap,netN,netW, tr.dataset.net==="1" ? d.net : null, d.short);   // caption = highlighted catalyst title
    setBig(tokCap,tokN,tokW, tr.dataset.tok==="1" ? d.tok : null, d.short);
    netCard.classList.add("hl"); tokCard.classList.add("hl");     // boxes wear the gold too
  } else {
    /* REVISION 7: totals are now decided PER COLUMN, so a column reveal lands its own total
       while the other side stays blank. (Was: both totals, only after every row was fully revealed.) */
    const allNet = trs.every(tr=>tr.dataset.net==="1");
    const allTok = trs.every(tr=>tr.dataset.tok==="1");
    setBig(netCap,netN,netW, allNet ? NET_TOTAL : null, "TOTAL SCORE");
    setBig(tokCap,tokN,tokW, allTok ? TOK_TOTAL : null, "TOTAL SCORE");
    netCard.classList.remove("hl"); tokCard.classList.remove("hl");
  }
  syncColumnButtons();
}

/* Column buttons wear the `.on` state while their whole column is revealed — the operator can read
   the board's column state off the cluster without scanning 13 rows. */
function syncColumnButtons(){
  document.getElementById("btnNetCol").classList.toggle("on", trs.every(tr=>tr.dataset.net==="1"));
  document.getElementById("btnTokCol").classList.toggle("on", trs.every(tr=>tr.dataset.tok==="1"));
}

/* ===== Row click — four-click cycle (UNCHANGED behaviour, re-expressed on the two flags) =====
   Highlight is a separate exclusive overlay (one gold row at a time). Per row:
     1st click → highlight + reveal Network
     2nd click → highlight + reveal Token
     3rd click → remove highlight, KEEP both scores shown
     4th click → blur both scores (back to start)
   Clicking a different row moves the gold to it and leaves the previous row's revealed scores
   in place (it simply loses its gold — landing in the "3rd-click" revealed-but-unhighlighted state).
   REVISION 7 adds one arm the old scalar could not reach: a row whose Token is shown but whose
   Network is hidden (produced by the Token column button) reveals Network and takes the gold —
   the exact analogue of the 1st click. */
function toggleRow(i){
  const tr=trs[i], net=tr.dataset.net==="1", tok=tr.dataset.tok==="1", hl=(hlIndex===i);
  if(!net){                    // Network hidden → reveal Network + take the gold
    tr.dataset.net="1"; setHighlight(i); flashCell(tr,".c-net");
  } else if(!tok){             // Network shown, Token hidden → reveal Token + hold/take the gold
    tr.dataset.tok="1"; setHighlight(i); flashCell(tr,".c-tok");
  } else if(hl){               // both shown + gold → drop the gold, keep both scores
    setHighlight(null);
  } else {                     // both shown, no gold → blur both (back to start)
    tr.dataset.net="0"; tr.dataset.tok="0";
  }
  applyReveal(tr);
  recompute();
}
function blurAll(){ trs.forEach(tr=>{ tr.dataset.net="0"; tr.dataset.tok="0"; applyReveal(tr);
    tr.querySelectorAll(".scorecell").forEach(c=>c.classList.remove("just")); });
  setHighlight(null);
  document.getElementById("tntClose").classList.remove("show");
  document.getElementById("btnVerdict").classList.remove("on"); recompute(); }
/* Reveal-all → every score shown, highlight cleared → boxes show the board TOTALS. */
function revealAll(){ trs.forEach(tr=>{ tr.dataset.net="1"; tr.dataset.tok="1"; applyReveal(tr); }); setHighlight(null); recompute(); }

/* ===== Per-COLUMN reveal (REVISION 7) =====
   One click flips a whole column. STATELESS: the button reads the board rather than latching its
   own state, so it stays correct no matter how many individual rows were clicked first —
   every row in the column revealed → the click HIDES the column; otherwise it REVEALS it.
   Clears the gold highlight (same as Reveal all), so the right rail falls through to that
   column's board total. `col` is "net" | "tok". */
function toggleColumn(col){
  const hideIt = trs.every(tr=>tr.dataset[col]==="1");
  const sel = col==="net" ? ".c-net" : ".c-tok";
  trs.forEach(tr=>{
    tr.dataset[col] = hideIt ? "0" : "1";
    applyReveal(tr);
    if(hideIt){ const c=tr.querySelector(sel); if(c) c.classList.remove("just"); }
  });
  setHighlight(null);
  recompute();
}

/* ===== Per-catalyst detail overlay (scores only) ===== */
function openDetail(i){
  const d=DATA[i];
  document.getElementById("dNum").textContent="Catalyst #"+d.n;
  document.getElementById("dTitle").textContent=d.short;
  document.getElementById("dFull").textContent=d.cat;
  const nn=document.getElementById("dNetN"); nn.textContent=fmt1(d.net); nn.className="dscore "+bandKey(d.net);
  const nw=document.getElementById("dNetW"); nw.textContent=bandWord(d.net); nw.className="dword "+bandKey(d.net);
  const tn=document.getElementById("dTokN"); tn.textContent=fmt1(d.tok); tn.className="dscore "+bandKey(d.tok);
  const tw=document.getElementById("dTokW"); tw.textContent=bandWord(d.tok); tw.className="dword "+bandKey(d.tok);
  const el=document.getElementById("detail");
  el.dataset.stage="0";            // always open with BOTH scores blurred (fresh for each take)
  el.classList.add("show");
}
function closeDetail(){ document.getElementById("detail").classList.remove("show"); }

/* Detail reveal: forward-only 0 → 1 (Network) → 2 (Token). Re-open to reset. */
function detailReveal(stage){
  const el=document.getElementById("detail");
  if(!el.classList.contains("show")) return;
  if(stage>+el.dataset.stage) el.dataset.stage=stage;   // never re-blur a revealed score
}
function detailRevealNext(){
  const el=document.getElementById("detail");
  if(el.classList.contains("show")) detailReveal(+el.dataset.stage+1);
}
document.querySelector("#detail .dg-net").addEventListener("click",()=>detailReveal(1)); // reveal Network
document.querySelector("#detail .dg-tok").addEventListener("click",()=>detailReveal(2)); // reveal Token (Network too)

/* ===== Verdict (TNT) ===== */
/* TNT dial value + all verdict-popup content come from BOARD (scorecard-sync). */
function buildClose(){ document.getElementById("vcDial").innerHTML = tntDialSVG(BOARD.tnt); }

/* Render the board title + the whole verdict popup from BOARD — bands DERIVED from the numbers. */
function renderTitle(){
  document.title = BOARD.ticker+" — "+BOARD.rows.length+" Catalysts Scored · 16:9 screenshare";
  document.getElementById("boardTitle").innerHTML = BOARD.ticker+' <span class="tnt">TNT</span> Scorecard';
  document.getElementById("boardSub").innerHTML = BOARD.rows.length+' catalysts scored for token and network impact';
}
function bandFill(el, base, score){ el.className = base+" "+bandKey(score); }
function renderVerdict(){
  const b=BOARD, v=b.verdict, t=b.totals;
  document.getElementById("vcLogo").innerHTML = b.logo;
  document.getElementById("vcName").textContent = b.name;
  document.getElementById("vcTick").textContent = b.ticker;
  const set=(id,base,score)=>{ const el=document.getElementById(id); el.textContent=fmt1(score); bandFill(el,base,score); };
  const setW=(id,base,score)=>{ const el=document.getElementById(id); el.textContent=bandWord(score); bandFill(el,base,score); };
  set("vcTntNum","vc-num",b.tnt);   setW("vcTntWord","vc-word",b.tnt);
  document.getElementById("vcHead").textContent = v.headline;
  document.getElementById("vcPara").textContent = v.paragraph;
  set("vcTokN","vc-n",t.tok);       setW("vcTokW","vc-w",t.tok);   document.getElementById("vcTokR").textContent=v.reads.token;
  set("vcNetN","vc-n",t.net);       setW("vcNetW","vc-w",t.net);   document.getElementById("vcNetR").textContent=v.reads.network;
  set("vcTechN","vc-n",b.technicals);setW("vcTechW","vc-w",b.technicals);document.getElementById("vcTechR").textContent=v.reads.technicals;
}
function toggleTNT(){
  const el=document.getElementById("tntClose");
  const showing=el.classList.toggle("show");
  if(showing) el.classList.add("tech-hidden");   // Technicals blurred fresh on every open
  document.getElementById("btnVerdict").classList.toggle("on", showing);
}
document.getElementById("vcTech").addEventListener("click",()=>document.getElementById("tntClose").classList.remove("tech-hidden")); // reveal Technicals

document.addEventListener("keydown",e=>{
  // Clicker / keyboard advance while the detail popup is open (Space or →)
  if((e.key===" "||e.key==="ArrowRight") && document.getElementById("detail").classList.contains("show")){
    e.preventDefault(); detailRevealNext(); return;
  }
  if(e.key==="Escape"){ closeDetail(); const t=document.getElementById("tntClose"); if(t.classList.contains("show")) toggleTNT(); }
  if(e.key==="t"||e.key==="T")toggleTNT();
  if(e.key==="b"||e.key==="B")blurAll();
  if(e.key==="a"||e.key==="A")revealAll();
  if(e.key==="n"||e.key==="N")toggleColumn("net");   // REVISION 7 — whole Network column
  if(e.key==="k"||e.key==="K")toggleColumn("tok");   // REVISION 7 — whole Token column ("T" is the verdict)
});

function fit(){ const s=Math.min(innerWidth/1920,innerHeight/1080);
  const st=document.getElementById("stage"); st.style.transform=`scale(${s})`; st.style.transformOrigin="center"; }
addEventListener("resize",fit);

/* init: dark board only (light theme removed) */
renderTitle(); renderVerdict(); buildClose(); recompute(); fit();
</script>
